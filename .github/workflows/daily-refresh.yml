name: Daily Refresh

on:
  schedule:
    # Corre 4 veces al día para agarrar partidos que se confirman/agregan más tarde
    # (algunas ligas como Brasileirao no aparecen en la corrida matutina, se agregan durante el día)
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 Berlin (verano)
    - cron: '0 11 * * *'  # 11:00 UTC = 13:00 Berlin
    - cron: '0 17 * * *'  # 17:00 UTC = 19:00 Berlin
    - cron: '0 23 * * *'  # 23:00 UTC = 01:00 Berlin
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Analizar cada liga secuencialmente
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.xyz
        # No usar "bash -e" implícito para este step: un timeout de curl (exit 28) en
        # UNA liga (ej. Conference League con muchos fixtures el mismo día) no debe
        # tumbar el resto del loop ni saltarse consolidate/settle-results.
        shell: bash --noprofile --norc {0}
        run: |
          set +e
          LEAGUES="2 13 11 3 848 39 40 41 42 140 141 135 136 78 79 61 62 88 94 203 144 128 71 253 262 113 103 179 307 164 106 119 188 197 207 218 235 239 242 283 292 332"
          for league in $LEAGUES; do
            echo "Analizando liga $league..."
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              "$BASE_URL/api/matches/analyze-league?leagueId=$league" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 55)
            curl_exit=$?
            if [ "$curl_exit" != "0" ]; then
              echo "  ⚠️ curl falló (exit $curl_exit, probablemente timeout) — sigue con la siguiente liga"
            else
              echo "  status: $code"
              if [ "$code" != "200" ]; then
                echo "  respuesta: $(cat /tmp/resp.json)"
              fi
            fi
            sleep 2
          done
          exit 0

      - name: Consolidar value bets
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.xyz
        run: |
          curl -s -w "\nstatus: %{http_code}\n" \
            "$BASE_URL/api/matches/consolidate" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 55

      - name: Settle resultados de partidos pasados
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.xyz
        run: |
          curl -s -w "\nstatus: %{http_code}\n" \
            "$BASE_URL/api/cron/settle-results" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 55
