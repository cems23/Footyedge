name: Daily Refresh

on:
  schedule:
    # 05:00 UTC = 07:00 Berlin (verano) / 06:00 Berlin (invierno)
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Analizar cada liga secuencialmente
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.xyz
        run: |
          LEAGUES="2 13 3 848 39 40 41 42 140 141 135 136 78 79 61 62 88 94 203 144 128 71 253 262 113 103 169 307 164"
          for league in $LEAGUES; do
            echo "Analizando liga $league..."
            code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              "$BASE_URL/api/matches/analyze-league?leagueId=$league" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 55)
            echo "  status: $code"
            if [ "$code" != "200" ]; then
              echo "  respuesta: $(cat /tmp/resp.json)"
            fi
            sleep 2
          done

      - name: Consolidar value bets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.xyz
        run: |
          curl -s -w "\nstatus: %{http_code}\n" \
            "$BASE_URL/api/matches/consolidate" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 55

      - name: Settle resultados de partidos pasados
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.xyz
        run: |
          curl -s -w "\nstatus: %{http_code}\n" \
            "$BASE_URL/api/cron/settle-results" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 55
