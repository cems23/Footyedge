name: Daily Refresh

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize pipeline report
        shell: bash --noprofile --norc {0}
        run: |
          echo "PIPELINE_FAILURE_LOG=$RUNNER_TEMP/footyedge-pipeline-failures" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/footyedge-pipeline-failures"

      - name: Analyze leagues
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          set +e
          LEAGUES="2 13 11 3 848 39 40 41 42 140 141 135 136 78 79 61 62 88 94 203 144 128 71 253 262 113 103 179 307 164 106 119 98 197 207 218 235 265 268 239 292 332 299"
          failures=0

          analyze_league() {
            local league="$1"
            local offset=0
            local attempt=1
            local response_file http_code curl_exit success failed_fixtures has_more next_offset batch_total

            while true; do
              response_file=$(mktemp)
              http_code=$(curl -sS -o "$response_file" -w "%{http_code}" "$BASE_URL/api/matches/analyze-league?leagueId=$league&offset=$offset&batchSize=1" -H "Authorization: Bearer $CRON_SECRET" --connect-timeout 15 --max-time 100)
              curl_exit=$?
              success=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('success') is True).lower())" "$response_file" 2>/dev/null)
              failed_fixtures=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('failedFixtures', 0))" "$response_file" 2>/dev/null)
              has_more=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('batch', {}).get('hasMore') is True).lower())" "$response_file" 2>/dev/null)
              next_offset=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('batch', {}).get('nextOffset', ''))" "$response_file" 2>/dev/null)
              batch_total=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('batch', {}).get('total', ''))" "$response_file" 2>/dev/null)
              rm -f "$response_file"

              if [ "$curl_exit" -eq 0 ] && [ "$http_code" -eq 200 ] && [ "$success" = "true" ] && [ "${failed_fixtures:-0}" = "0" ]; then
                echo "League $league: batch $((offset + 1))/${batch_total:-0} OK (attempt $attempt)"
                if [ "$has_more" = "true" ] && [ -n "$next_offset" ] && [ "$next_offset" -gt "$offset" ]; then
                  offset=$next_offset
                  attempt=1
                  sleep 2
                  continue
                fi
                return 0
              fi

              # Reintentar una vez solo errores transitorios de transporte o del
              # proxy. Una respuesta de datos inválida/fixtures fallidos se deja
              # visible como fallo real en vez de ocultarla con reintentos.
              if [ "$attempt" -lt 2 ] && { [ "$curl_exit" -eq 28 ] || [ "$http_code" = "502" ] || [ "$http_code" = "503" ] || [ "$http_code" = "504" ]; }; then
                echo "League $league batch $((offset + 1)) transient failure (attempt $attempt: curl=$curl_exit, HTTP=$http_code); retrying once in 12s"
                sleep 12
                attempt=$((attempt + 1))
                continue
              fi

              echo "League $league batch $((offset + 1)) failed (attempt $attempt, curl=$curl_exit, HTTP=$http_code, success=${success:-invalid}, failedFixtures=${failed_fixtures:-invalid})" | tee -a "$PIPELINE_FAILURE_LOG"
              return 1
            done
          }

          for league in $LEAGUES; do
            if ! analyze_league "$league"; then
              failures=$((failures + 1))
            fi
            sleep 2
          done
          {
            echo "### Daily analysis"
            echo "- Leagues with failures: $failures"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan configured injury watch
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          response_file=$(mktemp)
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" "$BASE_URL/api/cron/injury-watch" -H "Authorization: Bearer $CRON_SECRET" --connect-timeout 15 --max-time 130)
          curl_exit=$?
          success=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('success') is True).lower())" "$response_file" 2>/dev/null)
          status=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('status', 'invalid'))" "$response_file" 2>/dev/null)
          if [ "$curl_exit" -ne 0 ] || [ "$http_code" -ne 200 ] || [ "$success" != "true" ]; then
            echo "Injury watch failed (curl=$curl_exit, HTTP=$http_code, success=${success:-invalid})" | tee -a "$PIPELINE_FAILURE_LOG"
          else
            echo "Injury watch: $status" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -f "$response_file"

      - name: Consolidate value bets
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          response_file=$(mktemp)
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" "$BASE_URL/api/matches/consolidate" -H "Authorization: Bearer $CRON_SECRET" --max-time 55)
          curl_exit=$?
          success=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('success') is True).lower())" "$response_file" 2>/dev/null)
          if [ "$curl_exit" -ne 0 ] || [ "$http_code" -ne 200 ] || [ "$success" != "true" ]; then
            echo "Consolidate failed (curl=$curl_exit, HTTP=$http_code, success=${success:-invalid})" | tee -a "$PIPELINE_FAILURE_LOG"
          fi
          rm -f "$response_file"

      - name: Snapshot probability picks
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          response_file=$(mktemp)
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" "$BASE_URL/api/cron/snapshot-probability-picks" -H "Authorization: Bearer $CRON_SECRET" --max-time 55)
          curl_exit=$?
          success=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('success') is True).lower())" "$response_file" 2>/dev/null)
          if [ "$curl_exit" -ne 0 ] || [ "$http_code" -ne 200 ] || [ "$success" != "true" ]; then
            echo "Probability snapshot failed (curl=$curl_exit, HTTP=$http_code, success=${success:-invalid})" | tee -a "$PIPELINE_FAILURE_LOG"
          fi
          rm -f "$response_file"

      - name: Settle completed matches
        if: always()
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          response_file=$(mktemp)
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" "$BASE_URL/api/cron/settle-results" -H "Authorization: Bearer $CRON_SECRET" --max-time 55)
          curl_exit=$?
          success=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('success') is True).lower())" "$response_file" 2>/dev/null)
          if [ "$curl_exit" -ne 0 ] || [ "$http_code" -ne 200 ] || [ "$success" != "true" ]; then
            echo "Settle results failed (curl=$curl_exit, HTTP=$http_code, success=${success:-invalid})" | tee -a "$PIPELINE_FAILURE_LOG"
          fi
          rm -f "$response_file"

      - name: Publish pipeline result
        if: always()
        shell: bash --noprofile --norc {0}
        run: |
          if [ -s "$PIPELINE_FAILURE_LOG" ]; then
            {
              echo "### ❌ Daily pipeline failed"
              echo '```text'
              cat "$PIPELINE_FAILURE_LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### ✅ Daily pipeline completed" >> "$GITHUB_STEP_SUMMARY"
