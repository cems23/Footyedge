name: Capture Closing Odds (CLV)

on:
  # PAUSADO (14/08/2026) — 72 corridas/dia (cada minima 1 min facturado por
  # GitHub aunque tarde 8 segundos reales) agotaba la cuota gratuita de
  # Actions junto con settle-results. CLV todavia no tiene visualizacion
  # construida, asi que pausar esto no afecta nada visible al usuario. Sigue
  # disponible via workflow_dispatch para correrlo a mano cuando haga falta.
  # Retomar el schedule cuando: (a) exista la visualizacion de CLV, y (b) el
  # presupuesto de Actions este comodo (revisar github.com/settings/billing).
  workflow_dispatch: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Capturar cuota de cierre para partidos por arrancar
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          set +e
          curl -s -w "\nstatus: %{http_code}\n" "$BASE_URL/api/cron/capture-closing-odds" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 55
          exit 0
