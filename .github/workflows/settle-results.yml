name: Settle Results (hourly)

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch: {}

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Settle completed matches
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          set +e
          failures=0
          total_settled=0
          for i in 1 2 3 4; do
            response_file=$(mktemp)
            http_code=$(curl -sS -o "$response_file" -w "%{http_code}" "$BASE_URL/api/cron/settle-results" -H "Authorization: Bearer $CRON_SECRET" --max-time 55)
            curl_exit=$?
            success=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('success') is True).lower())" "$response_file" 2>/dev/null)
            settled=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('settled', 0))" "$response_file" 2>/dev/null)
            errors=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('errors', 0))" "$response_file" 2>/dev/null)
            if [ "$curl_exit" -ne 0 ] || [ "$http_code" -ne 200 ] || [ "$success" != "true" ] || [ "${errors:-0}" != "0" ]; then
              echo "Pass $i failed (curl=$curl_exit, HTTP=$http_code, success=${success:-invalid}, errors=${errors:-invalid})"
              failures=$((failures + 1))
              rm -f "$response_file"
              break
            fi
            total_settled=$((total_settled + settled))
            rm -f "$response_file"
            if [ "$settled" = "0" ] || [ -z "$settled" ]; then
              break
            fi
            sleep 2
          done
          {
            echo "### Hourly settlement"
            echo "- Matches settled: $total_settled"
            echo "- Failed passes: $failures"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failures" -ne 0 ]; then exit 1; fi

      - name: Re-consolidate rankings
        if: success()
        shell: bash --noprofile --norc {0}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: https://footyedge.app
        run: |
          response_file=$(mktemp)
          http_code=$(curl -sS -o "$response_file" -w "%{http_code}" "$BASE_URL/api/matches/consolidate" -H "Authorization: Bearer $CRON_SECRET" --max-time 55)
          curl_exit=$?
          success=$(python3 -c "import json,sys; print(str(json.load(open(sys.argv[1])).get('success') is True).lower())" "$response_file" 2>/dev/null)
          rm -f "$response_file"
          if [ "$curl_exit" -ne 0 ] || [ "$http_code" -ne 200 ] || [ "$success" != "true" ]; then
            echo "Consolidate failed (curl=$curl_exit, HTTP=$http_code, success=${success:-invalid})" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
